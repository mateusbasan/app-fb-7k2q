<style>
/* Layout: lateral rail on desktop, bottom tab bar on phones; agenda as a 7h-20h timeline, ficha as tabs. */
:root{
  --bg:#F3EEE6;          /* bege tinta inverno gelado */
  --surface:#FFFFFF;
  --ink:#3A332A;
  --muted:#85796B;
  --line:#E4DACB;
  --accent:#8C7648;      /* bronze do logo, escurecido para texto */
  --accent-soft:#EFE6D4;
  --brass:#A6936A;       /* cor exata do logo */
  --ok:#4F7F5A; --ok-soft:#E3EEE3;
  --warn:#A9741F; --warn-soft:#F6E9CE;
  --bad:#A94A3A; --bad-soft:#F5DDD8;
  --info:#4D6F8A; --info-soft:#DFE9F0;
  --c1:#3F6B4B; --c2:#D2BC8A;  /* recebido: verde escuro; a receber: bronze claro (separados por luminosidade) */
  --shadow:0 1px 2px rgba(58,51,42,.06),0 6px 20px rgba(58,51,42,.07);
  --f-display:'Jost',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1915;--surface:#26221D;--ink:#EFE8DB;--muted:#A0947F;--line:#3A342B;
  --accent:#CDB27A;--accent-soft:#3A3326;--brass:#B7A57C;
  --ok:#8DBE96;--ok-soft:#27352B;--warn:#E0B25F;--warn-soft:#3B3220;--bad:#E0806F;--bad-soft:#40231F;--info:#8DB3CF;--info-soft:#22313C;--c1:#8DBE96;--c2:#8A7648;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1915;--surface:#26221D;--ink:#EFE8DB;--muted:#A0947F;--line:#3A342B;
  --accent:#CDB27A;--accent-soft:#3A3326;--brass:#B7A57C;
  --ok:#8DBE96;--ok-soft:#27352B;--warn:#E0B25F;--warn-soft:#3B3220;--bad:#E0806F;--bad-soft:#40231F;--info:#8DB3CF;--info-soft:#22313C;--c1:#8DBE96;--c2:#8A7648;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
.muted{color:var(--muted)}.small{font-size:13px}.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* botões e campos */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500;min-height:40px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--brass)}
.btn svg{width:18px;height:18px;flex:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
:root[data-theme="dark"] .btn.pri{color:#1C1915}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#1C1915}}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent}
.btn:disabled{opacity:.55;cursor:wait}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:40px;width:100%;color:var(--ink);font-size:15px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.grid .wide{grid-column:1/-1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}

/* estrutura */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%;gap:0 28px;max-width:1280px;margin:0 auto}
.rail{position:sticky;top:0;align-self:start;height:100vh;padding:26px 0;display:flex;flex-direction:column;gap:22px}
.rail img{width:150px;height:auto;display:block}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;border:0;background:transparent;cursor:pointer;font-weight:500;color:var(--muted);text-align:left}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{background:var(--accent-soft)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.rail .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
main{padding:26px 0 40px;min-width:0}
.demo{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500;margin-bottom:16px}
.head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin-right:auto}
.tabbar{display:none}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{display:none}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{position:fixed;inset:0;width:100%}
  #root{height:100%}
  .app{display:flex;flex-direction:column;height:100%;min-height:0}
  main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(16px + env(safe-area-inset-top,0px)) 0 24px}
  .tabbar{display:grid;flex:none;grid-template-columns:repeat(var(--n,5),1fr);position:relative;background:var(--surface);border-top:1px solid var(--line);z-index:20;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;padding:6px 2px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;min-height:48px}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  h1{font-size:22px}
}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px 0}
.login .box{width:min(400px,100%);display:flex;flex-direction:column;gap:18px}
.login img{width:210px;max-width:70%;margin:0 auto 4px;display:block}
.err{color:var(--bad);font-size:13px;min-height:18px}

/* agenda */
.tl{display:grid;grid-template-columns:48px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tl .hours div{height:var(--hh);font-size:12px;color:var(--muted);text-align:right;padding:0 8px;transform:translateY(-8px)}
.tl .hours{padding-top:12px}
.tl .cols{position:relative;margin-top:12px;border-left:1px solid var(--line);cursor:cell}
.tl .hl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.tl .hl.half{border-top-style:dashed;opacity:.55}
.ev{position:absolute;border-radius:8px;padding:5px 8px;overflow:hidden;font-size:13px;line-height:1.3;cursor:pointer;border:1px solid transparent;border-left-width:4px;text-align:left;background:var(--accent-soft);color:var(--ink);width:auto}
.ev b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{color:var(--muted);font-size:12px}
.ev.s-agendado{border-left-color:var(--brass)}
.ev.s-confirmado{background:var(--ok-soft);border-left-color:var(--ok)}
.ev.s-em_atendimento{background:var(--info-soft);border-left-color:var(--info)}
.ev.s-atendido{background:var(--surface);border-color:var(--line);border-left-color:var(--muted);opacity:.85}
.ev.s-faltou{background:var(--warn-soft);border-left-color:var(--warn)}
.ev.s-cancelado,.ev.s-remarcado{background:var(--bad-soft);border-left-color:var(--bad);opacity:.7}
.ev.s-cancelado b{text-decoration:line-through}
.ev.comp{background:repeating-linear-gradient(135deg,var(--accent-soft),var(--accent-soft) 8px,var(--surface) 8px,var(--surface) 16px);border-left-color:var(--muted)}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--bad);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
.dnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dnav .lbl{font-family:var(--f-display);font-size:18px;font-weight:500;min-width:0}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}

/* listas */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;min-width:0}
.item:last-child{border-bottom:0}
.item:hover{background:var(--accent-soft)}
.item .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;flex:none}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* ficha */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:14px 0 18px;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.sum small{display:block;color:var(--muted);font-size:12px}
.sum b{font-family:var(--f-display);font-size:20px;font-weight:500}
.tline{display:flex;flex-direction:column;gap:12px}
.ent{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ent.signed{border-left:4px solid var(--ok)}
.ent .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.ent .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.ent .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbl{overflow-x:auto}
.sum .clk{cursor:pointer}.sum .clk:hover{border-color:var(--brass)}
.chart{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 8px;margin-bottom:16px;position:relative}
.chart svg{display:block;min-width:560px;width:100%;height:auto}
.chart .lg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:6px}
.chart .lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar{cursor:default}.chart .bar:hover{filter:brightness(1.12)}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.35;box-shadow:var(--shadow)}
.chks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 16px}
label.chk{flex-direction:row;align-items:center;gap:9px;color:var(--ink);font-size:14px;font-weight:400;cursor:pointer;padding:3px 0}
.chk input{width:18px;height:18px;min-height:0;flex:none;accent-color:var(--bad);padding:0}
.sec{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.sec h3{display:flex;align-items:center;gap:8px}
.alb{width:24px;height:24px;border-radius:50%;background:var(--bad);color:#fff;font:700 14px/1 var(--f-display);display:inline-grid;place-items:center;border:2px solid var(--surface);cursor:pointer;padding:0;flex:none}
.alb:hover{filter:brightness(1.12)}
.alb.lg{width:34px;height:34px;font-size:19px}
.ev .alb{position:absolute;top:4px;right:4px}
.ev.has-al b,.ev.has-al span{padding-right:22px}
.fh{position:relative;padding-right:46px}
.fh .alb{position:absolute;top:0;right:0}
.alrt{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.alrt:last-child{border-bottom:0}
.alrt b{display:block}
.alrt .pill{flex:none;margin-top:2px;min-width:58px;justify-content:center}

/* modal */
.ov{position:fixed;inset:0;background:rgba(30,25,18,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(620px,100%);padding:20px;display:flex;flex-direction:column;gap:16px;margin:auto 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;font-size:14px;max-width:min(92vw,520px);box-shadow:var(--shadow)}
@media (min-width:821px){.toast{bottom:28px}}
@media (prefers-reduced-motion:no-preference){.modal{animation:up .18s ease-out}@keyframes up{from{transform:translateY(10px);opacity:0}}}
</style>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pYmd=s=>{const [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dBR=s=>s?pYmd(s).toLocaleDateString('pt-BR'):'';
const dtBR=s=>s?new Date(s).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'';
const todayD=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const idade=s=>{if(!s)return null;const n=pYmd(s),t=new Date();let a=t.getFullYear()-n.getFullYear();if(t<new Date(t.getFullYear(),n.getMonth(),n.getDate()))a--;return a};
const idadeTxt=s=>{if(!s)return'';const a=idade(s);if(a==null||a<0)return'';if(a>=1)return a+(a===1?' ano':' anos');const n=pYmd(s),t=new Date();const m=(t.getFullYear()-n.getFullYear())*12+t.getMonth()-n.getMonth()-(t.getDate()<n.getDate()?1:0);return Math.max(m,0)+(m===1?' mês':' meses')};
const ini=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const clean=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,v===''?null:v]));

let sb=null;
function sbApi(){
  sb=supabase.createClient(CFG.url,CFG.key);
  const ck=r=>{if(r.error)throw r.error;return r.data};
  return{
    async session(){const {data}=await sb.auth.getSession();return data.session?.user?.email||null},
    async login(e,p){const r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error)throw r.error;return r.data.user.email},
    async logout(){await sb.auth.signOut()},
    async perfil(){const u=(await sb.auth.getUser()).data.user;if(!u)return null;const r=await sb.from('profiles').select('ativo,financeiro').eq('id',u.id).maybeSingle();return r.data},
    async list(t,o={}){
      let q=sb.from(t).select('*');
      for(const [k,v] of Object.entries(o.eq||{}))q=q.eq(k,v);
      if(o.gte)q=q.gte(o.gte[0],o.gte[1]);
      if(o.lt)q=q.lt(o.lt[0],o.lt[1]);
      for(const [c,asc] of (o.order||[]))q=q.order(c,{ascending:asc});
      return ck(await q.limit(5000));
    },
    async insert(t,row){return ck(await sb.from(t).insert(row).select().single())},
    async insertMany(t,rows){return ck(await sb.from(t).insert(rows).select())},
    async update(t,id,p){return ck(await sb.from(t).update(p).eq('id',id).select().single())},
    async remove(t,id){const r=await sb.from(t).delete().eq('id',id);if(r.error)throw r.error}
  };
}

function lanes(list){
  const sorted=[...list].sort((a,b)=>a._s-b._s),out=[];let cl=[],end=0,ends=[];
  const flush=()=>{const n=Math.max(...cl.map(c=>c._l))+1;cl.forEach(c=>c._n=n);out.push(...cl);cl=[];ends=[];end=0};
  for(const e of sorted){
    if(cl.length&&e._s>=end)flush();
    let l=ends.findIndex(x=>x<=e._s);if(l<0){l=ends.length;ends.push(0)}

function finChart(all){

async function buscaCep(el){
  const d=el.value.replace(/\D/g,'').slice(0,8);el.value=d.length>5?d.slice(0,5)+'-'+d.slice(5):d;
  const msg=$('#cepmsg');if(d.length!==8)return;
  try{
    if(msg)msg.textContent='Buscando endereço…';
    const j=await (await fetch(`https://viacep.com.br/ws/${d}/json/`)).json();
    if(j.erro){if(msg)msg.textContent='CEP não encontrado. Preencha o endereço.';return}
    const f=el.form;f.logradouro.value=j.logradouro||'';f.bairro.value=j.bairro||'';f.cidade.value=j.localidade||'';f.uf.value=j.uf||'';
    if(msg)msg.textContent='Endereço preenchido. Confira e digite o número.';f.numero.focus();
  }catch(err){if(msg)msg.textContent='Não consegui buscar o CEP agora. Preencha o endereço.'}
}

  if(e.target.id==='fq'){S.fq=e.target.value;$('#fbody').innerHTML=finBody();return}
  if(e.target.id==='pgpac'){const p=S.pac.find(x=>pacLabel(x)===e.target.value);$('#pgtr').innerHTML='<option value="">—</option>'+(p?S.trAll.filter(t=>t.paciente_id===p.id&&t.status!=='cancelado').map(t=>`<option value="${t.id}">${esc(t.descricao)}</option>`).join(''):'');return}
if(e.target.id==='busca'){S.busca=e.target.value;const q=S.busca.trim().toLowerCase();
  const list=S.pac.filter(p=>p.ativo!==false).filter(p=>!q||p.nome.toLowerCase().includes(q)||String(p.codigo)===q||(p.cpf||'').includes(q)||(p.celular||'').includes(q));$('#plist').innerHTML=plist(list)}});
document.addEventListener('mouseover',e=>{const g=e.target.closest?.('.bar');let t=document.querySelector('.tip');
  if(!g){t?.remove();return}
  const [m,n,v]=g.dataset.tip.split('|');if(!t){t=document.createElement('div');t.className='tip';document.body.appendChild(t)}
  t.innerHTML=`<b style="text-transform:capitalize">${m}</b><br>${n}: ${v}`;const r=g.getBoundingClientRect();t.style.left=Math.max(8,Math.min(innerWidth-170,r.left+r.width/2-60))+'px';t.style.top=Math.max(8,r.top-52)+'px'});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('.ev,[role=button]')){e.preventDefault();e.target.click()}});

/* ===================== início ===================== */
(async()=>{
  render();
  if(!DEMO){const em=await api.session().catch(()=>null);if(em)enter(em)}
})();
</script>
